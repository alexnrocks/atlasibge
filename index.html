<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Atlas HD em Alta Resolução</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
        #map { width: 100vw; height: 100vh; background: #181818; }
        #selector-box {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(255, 255, 255, 0.95); padding: 10px 18px;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex;
            align-items: center; gap: 12px; backdrop-filter: blur(5px);
        }
        #selector-box select { padding: 6px 12px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; min-width: 250px; }
        .leaflet-bottom.leaflet-left { bottom: 20px; left: 15px; }
        
        #rotate-box {
            position: absolute;
            bottom: 20px;
            right: 15px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 6px 10px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(5px);
        }

        .rotate-btn {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: #333;
            transition: background 0.2s;
        }

        .rotate-btn:hover {
            background: #e6e6e6;
        }
    </style>
</head>
<body>
    <div id="selector-box">
        <label for="mapSelect">📖 <b>Selecione a Página / Mapa:</b></label>
        <select id="mapSelect" onchange="carregarPrancha(this.value)"></select>
    </div>
    <div id="map"></div>
    <div id="rotate-box">
        <button class="rotate-btn" onclick="girarMapa(-90)" title="Girar 90° para a esquerda">↩️ -90°</button>
        <button class="rotate-btn" onclick="girarMapa(90)" title="Girar 90° para a direita">↪️ +90°</button>
        <button class="rotate-btn" onclick="resetarRotacao()" title="Resetar rotação">↺ Reset</button>
    </div>

    const map = L.map('map', { 
        crs: L.CRS.Simple, 
        minZoom: -3, 
        maxZoom: 4, 
        zoomSnap: 0.1, 
        zoomControl: false, 
        attributionControl: false 
    });
    
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    let currentOverlay = null;
    let anguloRotacao = 0;
    let chaveAtual = null;
    let imgOriginal = null;

    function carregarPrancha(chave) {
        chaveAtual = chave;
        anguloRotacao = 0;
        const dados = paginasAtlas[chave];
        if (!dados) return;

        const imgTemp = new Image();
        imgTemp.onload = function() {
            imgOriginal = this;
            atualizarMapa();
        };
        imgTemp.src = dados.mapaUrl;
    }

    function girarMapa(delta) {
        anguloRotacao = (anguloRotacao + delta) % 360;
        if (anguloRotacao < 0) anguloRotacao += 360;
        atualizarMapa();
    }

    function resetarRotacao() {
        anguloRotacao = 0;
        atualizarMapa();
    }

    function atualizarMapa() {
        if (!imgOriginal) return;

        if (currentOverlay) {
            map.removeLayer(currentOverlay);
        }

        let urlFinal = imgOriginal.src;
        let largFinal = imgOriginal.naturalWidth;
        let altFinal = imgOriginal.naturalHeight;

        // Se houver rotação, redesenha via Canvas
        if (anguloRotacao !== 0) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            const e90ou270 = (anguloRotacao === 90 || anguloRotacao === 270);
            largFinal = e90ou270 ? imgOriginal.naturalHeight : imgOriginal.naturalWidth;
            altFinal = e90ou270 ? imgOriginal.naturalWidth : imgOriginal.naturalHeight;

            canvas.width = largFinal;
            canvas.height = altFinal;

            // Rotação centralizada no Canvas
            ctx.translate(largFinal / 2, altFinal / 2);
            ctx.rotate((anguloRotacao * Math.PI) / 180);
            ctx.drawImage(imgOriginal, -imgOriginal.naturalWidth / 2, -imgOriginal.naturalHeight / 2);

            urlFinal = canvas.toDataURL('image/webp');
        }

        // Bounding box simétrica em relação à origem [0,0]
        // Garante que o centro da imagem seja sempre a coordenada [0,0] do Leaflet
        const halfH = altFinal / 2;
        const halfW = largFinal / 2;
        const bounds = [[-halfH, -halfW], [halfH, halfW]];

        currentOverlay = L.imageOverlay(urlFinal, bounds).addTo(map);
        map.fitBounds(bounds);
    }

    window.onload = () => {
        const select = document.getElementById('mapSelect');
        for (const [chave, item] of Object.entries(paginasAtlas)) {
            const opt = document.createElement('option');
            opt.value = chave;
            opt.textContent = item.titulo;
            select.appendChild(opt);
        }
        
        const primeiraChave = Object.keys(paginasAtlas)[0];
        if (primeiraChave) carregarPrancha(primeiraChave);
    };
